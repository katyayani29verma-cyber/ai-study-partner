version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: study_partner_db
    environment:
      POSTGRES_DB: study_partner_prod
      POSTGRES_USER: study_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - study_partner_network

  # Redis Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: study_partner_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - study_partner_network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: study_partner_api
    environment:
      # Database
      DATABASE_URL: postgresql://study_user:${DB_PASSWORD}@db:5432/study_partner_prod
      
      # Security
      SECRET_KEY: ${SECRET_KEY}
      MASTER_KEY: ${MASTER_KEY}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      
      # Logging
      LOG_LEVEL: INFO
      
      # Python
      PYTHONUNBUFFERED: 1
      PYTHONIOENCODING: utf-8
    
    ports:
      - "8000:8000"
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    volumes:
      - ./logs:/app/logs
    
    restart: unless-stopped
    networks:
      - study_partner_network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: study_partner_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - study_partner_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  study_partner_network:
    driver: bridge
