# Cron Jobs Configuration for AI Study Partner Backend Backups
# 
# This file contains the recommended cron schedule for automated backups.
# 
# To install these cron jobs:
# 1. Copy this file: cp cron_jobs.conf /tmp/cron_jobs.conf
# 2. Install cron jobs: crontab /tmp/cron_jobs.conf
# 3. Verify installation: crontab -l
#
# To edit existing cron jobs:
# crontab -e
#
# To remove cron jobs:
# crontab -r
#
# Cron Format: minute hour day month weekday command
# minute:  0-59
# hour:    0-23
# day:     1-31
# month:   1-12
# weekday: 0-7 (0 and 7 are Sunday)

# ============================================================================
# DATABASE BACKUPS
# ============================================================================

# Full database backup daily at midnight UTC
0 0 * * * cd /opt/ai-study-partner/backend/backups && bash scripts/backup_database.sh full >> ../logs/backup.log 2>&1

# Incremental backups every 6 hours (6 AM, 12 PM, 6 PM UTC)
0 6,12,18 * * * cd /opt/ai-study-partner/backend/backups && bash scripts/backup_database.sh incremental >> ../logs/backup.log 2>&1

# ============================================================================
# CONFIGURATION BACKUPS
# ============================================================================

# Configuration backup on deployment (triggered by deployment script)
# Manual trigger: bash scripts/backup_config.sh
# Or add to deployment script: bash /opt/ai-study-partner/backend/backups/scripts/backup_config.sh

# ============================================================================
# LOG BACKUPS
# ============================================================================

# Log backup and archival daily at 11 PM UTC
0 23 * * * cd /opt/ai-study-partner/backend/backups && bash scripts/backup_logs.sh gzip >> ../logs/backup.log 2>&1

# ============================================================================
# BACKUP MAINTENANCE
# ============================================================================

# Cleanup old backups daily at 2 AM UTC (remove backups older than 30 days)
0 2 * * * cd /opt/ai-study-partner/backend/backups && bash scripts/cleanup_old_backups.sh 30 >> ../logs/backup.log 2>&1

# ============================================================================
# BACKUP VERIFICATION
# ============================================================================

# Verify all backups daily at 3 AM UTC
0 3 * * * cd /opt/ai-study-partner/backend/backups && bash scripts/verify_backup.sh --all >> ../logs/backup.log 2>&1

# ============================================================================
# S3 ARCHIVAL
# ============================================================================

# Archive backups to S3 weekly on Sunday at 4 AM UTC
0 4 * * 0 cd /opt/ai-study-partner/backend/backups && bash scripts/archive_to_s3.sh >> ../logs/backup.log 2>&1

# ============================================================================
# MONITORING AND ALERTS
# ============================================================================

# Check backup status every hour
0 * * * * cd /opt/ai-study-partner/backend/backups && bash scripts/check_backup_status.sh >> ../logs/backup.log 2>&1

# Send daily backup report at 8 AM UTC
0 8 * * * cd /opt/ai-study-partner/backend/backups && bash scripts/send_backup_report.sh >> ../logs/backup.log 2>&1

# ============================================================================
# DISASTER RECOVERY DRILLS
# ============================================================================

# Monthly full restore test on first Sunday at 5 AM UTC
0 5 * * 0 [ $(date +%d) -le 07 ] && cd /opt/ai-study-partner/backend/backups && bash scripts/restore_database.sh latest --test >> ../logs/backup.log 2>&1

# Quarterly disaster recovery drill (first Sunday of quarter at 6 AM UTC)
# Q1: January, Q2: April, Q3: July, Q4: October
0 6 * 1,4,7,10 0 [ $(date +%d) -le 07 ] && cd /opt/ai-study-partner/backend/backups && bash recovery/disaster_recovery_drill.sh >> ../logs/backup.log 2>&1

# ============================================================================
# NOTES
# ============================================================================
#
# 1. All times are in UTC. Adjust for your timezone if needed.
#
# 2. Ensure DATABASE_URL environment variable is set:
#    export DATABASE_URL="postgresql://user:password@localhost/study_partner"
#
# 3. For S3 archival, ensure AWS credentials are set:
#    export AWS_ACCESS_KEY_ID="your-key"
#    export AWS_SECRET_ACCESS_KEY="your-secret"
#    export AWS_REGION="us-east-1"
#    export S3_BUCKET="ai-study-partner-backups"
#
# 4. Backup directory must exist and be writable:
#    mkdir -p /opt/ai-study-partner/backend/backups/{database,config,logs}
#
# 5. Log directory must exist:
#    mkdir -p /opt/ai-study-partner/backend/logs
#
# 6. All scripts must be executable:
#    chmod +x /opt/ai-study-partner/backend/backups/scripts/*.sh
#
# 7. Monitor cron job execution:
#    tail -f /opt/ai-study-partner/backend/logs/backup.log
#
# 8. Check cron logs (varies by system):
#    - Linux: grep CRON /var/log/syslog
#    - macOS: log stream --predicate 'process == "cron"'
#    - Docker: docker logs <container>
#
# 9. Common issues:
#    - Cron jobs not running: Check cron daemon is running
#    - Permission denied: Ensure scripts are executable
#    - DATABASE_URL not found: Set in cron environment or script
#    - Backup fails: Check disk space and database connection
#
# 10. Testing cron jobs:
#     - Run script manually: bash scripts/backup_database.sh full
#     - Check logs: tail -f ../logs/backup.log
#     - Verify backup created: ls -lh database/full/
#
# ============================================================================
